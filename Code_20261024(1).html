<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3f6">
<title>给你的小小心意</title>
<style>
:root {
  --pink: #e9a9bd;
  --pink-dark: #b96f8a;
  --pink-pale: #fff3f6;
  --ink: #805666;
  --white: #fffdfd;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 22px 14px;
  background:
    radial-gradient(ellipse at 12% 12%, rgba(255,255,255,.95) 0 3px, transparent 4px),
    radial-gradient(ellipse at 86% 20%, rgba(255,255,255,.8) 0 3px, transparent 4px),
    linear-gradient(145deg, #fff8fa 0%, #ffeaf0 48%, #fff4f7 100%);
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}
main {
  width: min(100%, 520px);
  padding: clamp(20px, 5vw, 34px) clamp(14px, 4vw, 28px) 28px;
  border: 1px solid rgba(226, 157, 180, .42);
  border-radius: 30px;
  background: rgba(255, 253, 253, .78);
  box-shadow: 0 18px 50px rgba(193, 119, 146, .15), inset 0 0 0 5px rgba(255,255,255,.45);
  text-align: center;
  overflow: hidden;
}
.image-wrap {
  width: min(100%, 340px);
  height: clamp(190px, 53vw, 300px);
  margin: 0 auto 16px;
  display: grid;
  place-items: center;
}
#character {
  display: block;
  max-width: 95%;
  max-height: 280px;
  width: auto;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 7px 10px rgba(154, 100, 119, .06));
  transition: opacity .18s ease, transform .2s ease;
}
#character.changing { opacity: .35; transform: scale(.97); }
h1 {
  margin: 0 auto 24px;
  max-width: 100%;
  font-size: clamp(20px, 5.2vw, 27px);
  line-height: 1.55;
  font-weight: 750;
  letter-spacing: .02em;
  overflow-wrap: anywhere;
}
.buttons {
  min-height: 70px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
button {
  border: 0;
  border-radius: 999px;
  padding: 13px 20px;
  min-height: 46px;
  max-width: 100%;
  background: #f3c4d2;
  color: #75475a;
  box-shadow: 0 5px 0 #df9fb5, 0 8px 15px rgba(189, 113, 143, .13);
  font: inherit;
  font-size: 15px;
  font-weight: 650;
  line-height: 1.35;
  cursor: pointer;
  white-space: normal;
  overflow-wrap: anywhere;
  transition: transform .22s ease, padding .22s ease, font-size .22s ease, opacity .22s ease, box-shadow .22s ease;
  -webkit-tap-highlight-color: transparent;
}
button:active { transform: translateY(3px) scale(.98); }
/* 左边按钮保持浅粉色，右边按钮保持浅蓝色 */
button.primary { background: #f7c9d8; color: #75475a; box-shadow: 0 5px 0 #e7a7bd, 0 8px 15px rgba(189, 113, 143, .15); }
button.secondary { background: #dff1ff; color: #385d78; border: 1px solid #b7dcf5; box-shadow: 0 5px 0 #a9d1ee, 0 8px 15px rgba(89, 151, 190, .12); }
button.gone { display: none; }
.site-signature { margin-top: 18px; color: #d8cbd0; font-size: 10px; letter-spacing: .08em; opacity: .85; font-weight: 400; }
@media (max-width: 380px) {
  main { border-radius: 24px; padding-inline: 12px; }
  .image-wrap { height: 190px; margin-bottom: 12px; }
  h1 { margin-bottom: 19px; }
  .buttons { gap: 10px; }
  button { padding: 12px 15px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main aria-live="polite">
  <!--图片放在标题上方，符合你的要求-->
  <div class="image-wrap"><img id="character" src="images/image-01.png" alt="可爱的小猫涂鸦"></div>
  <h1 id="heading">你原谅我好不好呀？૮⑅•̤ ༝ •̤⑅ა</h1>
  <div class="buttons">
    <button id="yes" class="primary">我已经原谅你啦，亲亲宝宝</button>
    <button id="no" class="secondary">不原谅，你走开</button>
  </div>
  <div class="site-signature">ynnnnforyou</div>
</main>
<script>
(() => {
  const heading = document.getElementById('heading');
  const image = document.getElementById('character');
  const yes = document.getElementById('yes');
  const no = document.getElementById('no');

  const firstTitle = '你原谅我好不好呀？૮⑅•̤ ༝ •̤⑅ა';
  const secondTitle = '你爱我吗';
  const finalTitle = '我也是！再亲亲呀。我也特别特别喜欢你。只喜欢你。只爱你。';

  //第一阶段右侧按钮文字序列
  const stage1NoTexts = [
    "你确定吗…",
    "你就原谅我好不好呀",
    "不许选这个…",
    "我要哭的呀",
    "不要。"
  ];
  //第二阶段右侧按钮文字序列
  const stage2NoTexts = [
    "只有一点点吗。",
    "你再点这个试试",
    "^-^"
  ];

  let stage = 1; //1第一关，1.5过渡，2第二关，3结局
  let noClicks = 0;
  let yesScale = 1;
  let noScale = 1;

  //切换图片函数
  function setImage(number) {
    image.classList.add('changing');
    const nextSrc = `images/image-${String(number).padStart(2, '0')}.png`;
    const preload = new Image();
    preload.onload = () => {
      image.src = nextSrc;
      requestAnimationFrame(() => image.classList.remove('changing'));
    };
    preload.onerror = () => image.classList.remove('changing');
    preload.src = nextSrc;
  }

  function resetButtonSizes() {
    yesScale = 1;
    noScale = 1;
    yes.style.transform = '';
    no.style.transform = '';
    yes.style.fontSize = '';
    no.style.fontSize = '';
    yes.style.padding = '';
    no.style.padding = '';
  }

  function resizeButtons() {
    yesScale = Math.min(1.75, yesScale + 0.12);
    noScale = Math.max(0.52, noScale - 0.12);
    yes.style.transform = `scale(${yesScale})`;
    no.style.transform = `scale(${noScale})`;
    yes.style.fontSize = `${15 * Math.min(1.25, yesScale)}px`;
    no.style.fontSize = `${15 * Math.max(.72, noScale)}px`;
    yes.style.padding = `${13 * Math.min(1.2, yesScale)}px ${20 * Math.min(1.2, yesScale)}px`;
    no.style.padding = `${13 * Math.max(.65, noScale)}px ${20 * Math.max(.65, noScale)}px`;
  }

  //进入第二关
  function enterStage2(){
    stage = 2;
    noClicks = 0;
    heading.textContent = secondTitle;
    yes.textContent = '特别特别爱你';
    no.textContent = '一点点爱你';
    yes.classList.remove('gone');
    no.classList.remove('gone');
    resetButtonSizes();
    setImage(7);
  }

  //结局
  function enterFinal(){
    stage =3;
    heading.textContent = finalTitle;
    yes.textContent = '再来一次';
    no.classList.add('gone');
    resetButtonSizes();
    setImage(11);
  }

  //全部重置回到开局
  function resetAll(){
    stage =1;
    noClicks =0;
    heading.textContent = firstTitle;
    yes.textContent = '我已经原谅你啦，亲亲宝宝';
    no.textContent = '不原谅，你走开';
    yes.classList.remove('gone');
    no.classList.remove('gone');
    resetButtonSizes();
    setImage(1);
  }

  yes.addEventListener('click',()=>{
    if(stage === 1){
      //第一阶段，点左边直接图6，不管之前点了多少次不原谅
      setImage(6);
      stage = 1.5;
      heading.textContent = '我也亲亲你！还要亲还要。';
      yes.textContent = '那再点一下这里';
      no.classList.add('gone');
      resetButtonSizes();
      return;
    }
    if(stage === 1.5){
      enterStage2();
      return;
    }
    if(stage ===2){
      enterFinal();
      return;
    }
    if(stage ===3){
      resetAll();
    }
  });

  no.addEventListener('click',()=>{
    if(stage === 1){
      if(noClicks < stage1NoTexts.length){
        no.textContent = stage1NoTexts[noClicks];

        //严格按照你的图片切换规则
        if(noClicks === 1){
          setImage(2);
        }else if(noClicks ===2){
          setImage(3);
        }else if(noClicks ===3){
          setImage(4);
        }else if(noClicks ===4){
          setImage(5);
        }
        //noClicks=0（第一次点不原谅）图片保持图1，不切换

        noClicks += 1;
        resizeButtons();
      }else{
        no.classList.add('gone');
      }
      return;
    }

    if(stage ===2){
      if(noClicks < stage2NoTexts.length){
        no.textContent = stage2NoTexts[noClicks];
        if(noClicks === 0){
          setImage(8);
        }else if(noClicks === 1){
          setImage(9);
        }else if(noClicks ===2){
          setImage(10);
        }
        noClicks += 1;
        resizeButtons();
      }else{
        no.classList.add('gone');
      }
    }
  });
})();
</script>
</body>
</html>
